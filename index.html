    <link rel="preload" as="image" href="/lovable-uploads/ee0f6b42-ae3f-4df3-ab7b-277d5f05ef1c.png" fetchpriority="high">
    
    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/antonio/v17/gNMbW2BrTpS8_Y-67g2VHPesZW2xOQ-xsNqO47m55DA.woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Critical CSS inline -->
    <style>
      /* Performance optimizations - no FOIT, immediate layout */
      :root {
        --ease-smooth: cubic-bezier(0.22, 0.61, 0.36, 1);
        --dur-fast: 320ms;
        --gb-gray: 0 0% 92%;
        --gb-green: 180 25% 26%;
        --gb-green-hover: 180 25% 23%;
      }
      
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* Critical layout styles */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        margin: 0;
        background-color: hsl(var(--gb-gray));
        color: #1a1a1a;
        line-height: 1.5;
      }
      
      /* Animation states */
      [data-anim="slide-in"] {
        transform: translate3d(24px, 0, 0);
        opacity: 0;
        will-change: transform, opacity;
        contain: layout paint style;
      }
      
      .anim-ready [data-anim="slide-in"] {
        transform: translate3d(0, 0, 0);
        opacity: 1;
        transition: transform var(--dur-fast) var(--ease-smooth),
                   opacity var(--dur-fast) var(--ease-smooth);
      }
      
      /* Staggered delays for smooth cascade */
      .anim-ready [data-anim="slide-in"]:nth-child(1) { transition-delay: 0ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(2) { transition-delay: 80ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(3) { transition-delay: 160ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(4) { transition-delay: 240ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(5) { transition-delay: 320ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(6) { transition-delay: 400ms; }
      .anim-ready [data-anim="slide-in"]:nth-child(7) { transition-delay: 480ms; }
      
      /* Critical layout - prevent CLS */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      
      .logo-container {
        width: 144px;
        height: 36px;
        margin: 0 auto 24px;
      }
      
      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
    
    <!-- Performance script - inline critical path -->
    <script>
      (function() {
        const d = document, html = d.documentElement;
        
        // Mark start time for performance monitoring
        window.__pageStart = performance.now();
        
        // Initialize animations after first stable frame
        function initAnimations() {
          requestAnimationFrame(() => {
            if (document.fonts && document.fonts.ready) {
              document.fonts.ready.finally(() => {
                html.classList.add('anim-ready');
                // Mark animation start
                window.__animStart = performance.now();
              });
            } else {
              html.classList.add('anim-ready');
              window.__animStart = performance.now();
            }
          });
        }
        
        // Wait for DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initAnimations);
        } else {
          initAnimations();
        }
        
        // Preconnect to external domains for link warmup
        function warmupExternalLinks() {
          const domains = [
            'https://budamix-partner-portal.lovable.app',
            'https://wa.me',
            'https://www.amazon.com.br',
            'https://www.mercadolivre.com.br',
            'https://br.shp.ee',
            'https://www.instagram.com'
          ];
          
          domains.forEach(domain => {
            const link = document.createElement('link');
            link.rel = 'preconnect';
            link.href = new URL(domain).origin;
            document.head.appendChild(link);
          });
        }
        
        // Defer non-critical work
        if (window.requestIdleCallback) {
          window.requestIdleCallback(warmupExternalLinks, { timeout: 2000 });
        } else {
          setTimeout(warmupExternalLinks, 100);
        }
      })();
    </script>
  </head>

  <body>

  </body>
